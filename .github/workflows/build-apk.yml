name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile — "preview" produces a standalone installable APK; "development" produces a dev-client APK that requires a running Expo dev server'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  pre-build:
    name: Pre-build checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx jest --ci --watchAll=false --passWithNoTests

  build:
    name: Build Android APK (${{ inputs.profile }})
    runs-on: ubuntu-latest
    needs: pre-build
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project
        run: eas init --non-interactive --force 

      - name: Build APK via EAS
        id: eas-build
        run: |
          # pipefail ensures the step fails if eas build exits non-zero, even though
          # its output is piped through tee (without pipefail the step exit code would
          # be tee's exit code, which is always 0).
          set -o pipefail
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            2>&1 | tee /tmp/eas-output.txt
          BUILD_URL=$(grep -oE 'https://expo\.dev/accounts/[^[:space:]]+' /tmp/eas-output.txt | tail -1 || true)
          echo "build-url=${BUILD_URL}" >> "$GITHUB_OUTPUT"
          # Extract build ID (last path segment of the URL) for log fetching
          BUILD_ID=$(echo "${BUILD_URL}" | grep -oE '[0-9a-f-]{36}$' || true)
          echo "build-id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: Print APK download URL
        if: steps.eas-build.outputs.build-url != ''
        run: echo "APK download URL ${{ steps.eas-build.outputs.build-url }}"

      - name: Fetch EAS build logs
        if: always() && steps.eas-build.outputs.build-id != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "::group::EAS build logs (build ID: ${{ steps.eas-build.outputs.build-id }})"
          eas build:logs --build-id ${{ steps.eas-build.outputs.build-id }} || true
          echo "::endgroup::"
