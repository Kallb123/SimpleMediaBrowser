name: Pre-Build Test

on:
  pull_request:
    branches:
      - main

jobs:
  pre-build:
    name: Pre-build checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .expo/types is gitignored and normally only written by `expo start`;
      # generate the typed-route declarations so tsc can catch bad hrefs.
      - name: Generate typed-route declarations
        run: npm run typegen

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx jest --ci --watchAll=false --passWithNoTests 
